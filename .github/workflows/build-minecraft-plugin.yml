name: Build Minecraft Plugin & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B
        working-directory: minecraft-plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiChatPlugin
          path: minecraft-plugin/target/ProxiChatPlugin-*.jar

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxiChatPlugin

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProxiChat Plugin ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## ProxiChat Minecraft Plugin ${{ steps.get_version.outputs.VERSION }}
            
            ### Installation
            1. Téléchargez le fichier JAR ci-dessous
            2. Placez-le dans le dossier `plugins` de votre serveur Minecraft
            3. Redémarrez votre serveur
            
            ### Changelog
            Voir les commits pour les détails des changements.
          files: |
            ProxiChatPlugin-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
