name: Build Minecraft Plugin & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to build for'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '1.19'
          - '1.20'
          - '1.21'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft_version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minecraft_version != 'all' && fromJson(format('["{0}"]', github.event.inputs.minecraft_version)) || fromJson('["1.19", "1.20", "1.21"]') }}
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven for Minecraft ${{ matrix.minecraft_version }}
        run: mvn clean package -B -Dspigot.version=${{ matrix.minecraft_version }}-R0.1-SNAPSHOT
        working-directory: minecraft-plugin

      - name: Rename artifact with version
        run: |
          cd minecraft-plugin/target
          for f in ProxiChatPlugin-*.jar; do
            mv "$f" "${f%.jar}-${{ matrix.minecraft_version }}.jar"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiChatPlugin-${{ matrix.minecraft_version }}
          path: minecraft-plugin/target/ProxiChatPlugin-*-${{ matrix.minecraft_version }}.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure
        run: ls -R

      - name: Get short SHA
        id: get_sha
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ProxiChat Plugin Build #${{ github.run_number }}
          body: |
            ## ProxiChat Minecraft Plugin Build #${{ github.run_number }}
            
            **Commit:** ${{ steps.get_sha.outputs.SHA_SHORT }}
            
            ### Versions disponibles
            - **MC 1.19** - Compatible Minecraft 1.19.x
            - **MC 1.20** - Compatible Minecraft 1.20.x
            - **MC 1.21** - Compatible Minecraft 1.21.x
            
            ### Installation
            1. Téléchargez le fichier JAR correspondant à votre version de Minecraft
            2. Placez-le dans le dossier `plugins` de votre serveur Minecraft
            3. Redémarrez votre serveur
          draft: false
          prerelease: false
          files: |
            ProxiChatPlugin-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
