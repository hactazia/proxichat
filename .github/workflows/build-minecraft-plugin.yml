name: Build Minecraft Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'minecraft-plugin/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'minecraft-plugin/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file minecraft-plugin/pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiChatPlugin
          path: minecraft-plugin/target/ProxiChatPlugin-*.jar
          if-no-files-found: error
