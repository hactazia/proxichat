name: Build Minecraft Plugin & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B
        working-directory: minecraft-plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiChatPlugin
          path: minecraft-plugin/target/ProxiChatPlugin-*.jar

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxiChatPlugin

      - name: Get short SHA
        id: get_sha
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ProxiChat Plugin Build #${{ github.run_number }}
          body: |
            ## ProxiChat Minecraft Plugin Build #${{ github.run_number }}
            
            **Commit:** ${{ steps.get_sha.outputs.SHA_SHORT }}
            
            ### Installation
            1. Téléchargez le fichier JAR ci-dessous
            2. Placez-le dans le dossier `plugins` de votre serveur Minecraft
            3. Redémarrez votre serveur
          files: |
            ProxiChatPlugin-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
