name: Build Minecraft Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file minecraft-plugin/pom.xml

      - name: Get plugin version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --file minecraft-plugin/pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProxiChatPlugin ${{ github.ref_name }}
          body: |
            ## ProxiChatPlugin ${{ github.ref_name }}
            
            ### Installation
            Téléchargez le fichier JAR ci-dessous et placez-le dans le dossier `plugins` de votre serveur Minecraft.
          files: minecraft-plugin/target/ProxiChatPlugin-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
