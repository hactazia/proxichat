name: Build & Release Minecraft Plugin

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to build for'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '1.19'
          - '1.20'
          - '1.21'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft_version: ${{ (github.event_name == 'push' || github.event.inputs.minecraft_version == 'all') && fromJson('["1.19","1.20","1.21"]') || fromJson(format('["{0}"]', github.event.inputs.minecraft_version)) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build plugin
        run: mvn clean package -B -Dspigot.version=${{ matrix.minecraft_version }}-R0.1-SNAPSHOT
        working-directory: minecraft-plugin

      - name: Rename artifact
        run: |
          cd minecraft-plugin/target
          for f in ProxiChatPlugin-*.jar; do
            mv "$f" "${f%.jar}-${{ matrix.minecraft_version }}.jar"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxiChatPlugin-${{ matrix.minecraft_version }}
          path: minecraft-plugin/target/ProxiChatPlugin-*-${{ matrix.minecraft_version }}.jar

  verify:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify artifacts exist
        run: |
          for file in artifacts/ProxiChatPlugin-*/*.jar; do
            if [ ! -f "$file" ]; then
              echo "Artifact $file missing!"
              exit 1
            fi
            echo "Verified $file"
          done

      - name: "Optional: Verify file sizes"
        run: |
          for file in artifacts/ProxiChatPlugin-*/*.jar; do
            size=$(stat -c%s "$file")
            if [ $size -lt 50000 ]; then
              echo "Artifact $file seems too small ($size bytes)"
              exit 1
            fi
          done

  release:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only release from main branch
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Get short SHA
        id: get_sha
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: ProxiChat Plugin Build #${{ github.run_number }}
          body: |
            ## ProxiChat Minecraft Plugin Build #${{ github.run_number }}
            
            **Commit:** ${{ steps.get_sha.outputs.SHA_SHORT }}
            
            ### Versions disponibles
            - **MC 1.19** - Compatible Minecraft 1.19.x
            - **MC 1.20** - Compatible Minecraft 1.20.x
            - **MC 1.21** - Compatible Minecraft 1.21.x
            
            ### Installation
            1. Téléchargez le fichier JAR correspondant à votre version de Minecraft
            2. Placez-le dans le dossier `plugins` de votre serveur Minecraft
            3. Redémarrez votre serveur
          draft: false
          prerelease: false
          files: |
            artifacts/ProxiChatPlugin-*/*.jar
